name: Deploy

# push main         -> staging    (automatic -- the integration branch is always live on staging)
# push tag `v*`     -> production  (gated by the `production` GitHub Environment: your approval)
# workflow_dispatch -> the stage you pick (CODE ONLY: no migrations -- see the migrate step)
#
# Why a tag and not a `main` push for production: `main` is where work integrates, and an
# integration branch that also auto-ships to a real domain is one mis-click from a bad prod
# deploy. research/05-architecture.md section 8's "no `v*.*.*` tag -- tagging every deploy is
# friction a solo dev eventually skips" was written with no users and no prod domain; with
# `app.guestnote.be` real, one deliberate `git tag` per release is friction now worth paying.
# See that file's 2026-08-29 correction note. Rollback is `git revert` + a new tag, which
# re-runs this on the prior tree.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy (code only -- migrations run only on a push)
        type: choice
        options: [staging, production]
        default: staging

# Serialize per RESOLVED stage. A dispatched prod deploy and a tag-triggered one must share
# one lock or they race the single Pulumi state; keying on `inputs.stage` alone would put
# them in different groups. The ternary is repeated here because a workflow-level
# `concurrency` cannot read job `env`. `cancel-in-progress: false` -- a half-cancelled
# `sst deploy` leaves Pulumi state locked.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || (github.ref_type == 'tag' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # event first: a `workflow_dispatch` still reports `github.ref_type == 'branch'`, so
      # the dispatch arm has to win before the tag check.
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || (github.ref_type == 'tag' && 'production' || 'staging') }}
      AWS_REGION: eu-central-1
    # Every deploy runs against a GitHub Environment named for its stage, so the OIDC token's
    # `sub` is `repo:JorenNagels/guestnote:environment:<stage>` -- which is exactly what
    # `infra/github-oidc.yaml` pins `GuestnoteDeployRole` to. `staging` is auto-created and
    # needs no protection rules. `production` MUST carry "Required reviewers" (you) and a
    # deployment-tag rule of `v*`, or a stray tag reaches prod ungated -- infra/README.md 4b.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || (github.ref_type == 'tag' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the migrate step diffs a stored marker SHA (which can be many
          # commits back) against HEAD, and a shallow clone cannot resolve it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore Next build cache
        uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ env.STAGE }}-${{ github.sha }}
          restore-keys: |
            next-${{ env.STAGE }}-

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GuestnoteDeployRole
          aws-region: ${{ env.AWS_REGION }}
          # A first-ever CloudFront distribution create can take 20-30 min; the default
          # 1 h session then expires mid-provision and leaves a half-built stack.
          role-duration-seconds: 7200

      # Migrations run BEFORE the code deploys (expand -> deploy -> contract, research/05
      # section 8), over the DIRECT/unpooled endpoint as the branch owner -- DDL through
      # Neon's transaction-mode pooler is unsupported (packages/db/README.md).
      #
      # This database has no usable `__drizzle_migrations` journal (CLAUDE.md invariant 8 --
      # the table exists but is empty), so "replay from zero" is out. Instead a per-stage
      # SSM marker, `/guestnote/<stage>/MIGRATED_THROUGH`, holds the last git SHA whose
      # migrations are applied to that stage's Neon branch. We apply only the migration
      # files ADDED between that SHA and the one being deployed.
      #
      #   - `workflow_dispatch` is CODE-ONLY: the step is skipped entirely. It exists for
      #     re-deploying after a secret rotation or a flaked deploy, not for schema.
      #   - A missing marker means the stage was never bootstrapped. The first deploy of a
      #     stage applies the full set by hand and writes the marker (infra/README.md,
      #     "First deploy"); CI refuses rather than guess what is already on the branch.
      #   - `psql -f` on raw `.sql` is not idempotent -- re-running an applied range stops
      #     on "already exists". The marker advances as soon as the apply loop succeeds,
      #     BEFORE the deploy, so a deploy that fails after migrations does not cause them
      #     to be replayed on the retry.
      - name: Apply new migrations
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          MARKER="/guestnote/$STAGE/MIGRATED_THROUGH"
          FROM=$(aws ssm get-parameter --name "$MARKER" \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -z "$FROM" ]; then
            echo "::error::$MARKER is not set -- $STAGE has not been bootstrapped. Apply the full migration set by hand and write the marker (infra/README.md, 'First deploy')."
            exit 1
          fi
          if ! git cat-file -e "${FROM}^{commit}" 2>/dev/null; then
            echo "::error::marker SHA $FROM is not in history -- the migration range would be wrong. Fix $MARKER or apply by hand (infra/README.md)."
            exit 1
          fi

          NEW=$(git diff --name-only --diff-filter=A "$FROM" "${{ github.sha }}" \
            -- 'packages/db/migrations/0*.sql' | sort)

          if [ -z "$NEW" ]; then
            echo "No new migration files between $FROM and ${{ github.sha }}."
          else
            UNPOOLED=$(aws ssm get-parameter --name "/guestnote/$STAGE/DATABASE_URL_UNPOOLED" \
              --with-decryption --query Parameter.Value --output text)
            # Keep the credential out of the log if a later `set -x` or `psql -e` prints it.
            # Actions masks exact strings, so mask the password substring too.
            echo "::add-mask::$UNPOOLED"
            PW=$(printf '%s' "$UNPOOLED" | sed -E 's#^[a-z]+://[^:]+:([^@]+)@.*#\1#')
            [ -n "$PW" ] && [ "$PW" != "$UNPOOLED" ] && echo "::add-mask::$PW"

            for f in $NEW; do
              echo "::group::applying $f"
              psql "$UNPOOLED" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
              echo "::endgroup::"
            done
          fi

          # Every migration in range is now applied -- advance the marker. Before the deploy
          # on purpose; see the step comment.
          aws ssm put-parameter --name "$MARKER" --type String --overwrite \
            --value "${{ github.sha }}" >/dev/null
          echo "$MARKER -> ${{ github.sha }}"

      - name: Deploy
        run: npx sst deploy --stage "$STAGE"

      # The one gate that catches a DATABASE_URL pointed at a BYPASSRLS role -- the ADR 0001
      # trap, which disables every RLS policy with no error anywhere. `/api/health` does a
      # real withUser round-trip and returns 503 / ok:false when the connected role is not
      # `app_user` or can bypass RLS. Without this a deploy against a mis-set URL goes green
      # and every tenant read crosses org boundaries.
      #
      # Targets the real hostname, so on `production` this expects the apex/app cutover to
      # be done (infra/README.md) -- the first prod deploy is a laptop step anyway.
      - name: Verify RLS is armed
        run: |
          set -euo pipefail
          ROOT_DOMAIN=$([ "$STAGE" = production ] && echo guestnote.be || echo staging.guestnote.be)
          URL="https://app.${ROOT_DOMAIN}/api/health"
          echo "GET $URL"
          BODY=$(curl -fsS --retry 6 --retry-all-errors --retry-delay 10 "$URL")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok": true' || {
            echo "::error::/api/health did not report ok:true. RLS may be disarmed (ADR 0001) -- check the role behind /guestnote/$STAGE/DATABASE_URL. The deploy is live; investigate now."
            exit 1
          }

      - name: Save Next build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ env.STAGE }}-${{ github.sha }}
