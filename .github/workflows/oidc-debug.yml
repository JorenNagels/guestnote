name: OIDC debug

# TEMPORARY -- delete once the deploy role's trust policy is proven.
#
# Prints the CLAIMS of the GitHub OIDC token this repo presents, so the trust policy in
# infra/github-oidc.yaml can be written against what is actually sent rather than what the
# docs imply. Added 2026-08-30 after three failed CI deploys where `sub` matched the policy
# exactly and STS still refused -- which means one of the other pinned claims
# (`repository`, `repository_owner`) does not hold the value the policy expects, and
# GitHub's docs do not say what those become under the immutable subject format.
#
# It prints claims, never the raw JWT: the token is a credential for ~5 minutes and must not
# land in a log. The claim VALUES here are all public facts about the repo.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    # The same environment deploy.yml uses, so the token is the same shape as the failing one.
    environment: staging
    steps:
      - name: Print OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const [, payload] = token.split('.')
            const claims = JSON.parse(Buffer.from(payload, 'base64url').toString('utf8'))
            // Sorted, one per line, so the interesting three are easy to find.
            for (const k of Object.keys(claims).sort()) {
              core.info(`${k} = ${JSON.stringify(claims[k])}`)
            }
