AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  GitHub Actions OIDC provider and the GuestnoteDeployRole that .github/workflows/deploy.yml
  assumes to run `sst deploy`. No long-lived AWS keys anywhere.

# Why this is CloudFormation and not CDK or SST
# --------------------------------------------
# Same reasoning as infra/mail-events.yaml's header: this is the bootstrap that lets CI run
# SST at all, so it cannot itself be an SST resource, and pulling in aws-cdk-lib for two
# resources is not worth it. Applied by hand, once, from the laptop:
#
#   aws cloudformation deploy \
#     --template-file infra/github-oidc.yaml \
#     --stack-name guestnote-github-oidc \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --profile guestnote --region eu-central-1 \
#     --parameter-overrides GitHubSub='<see below>'
#
# The guestnote AWS account (929219061071) is separate from the se-parti siblings'
# 438465163166, so their shared GitHubActionsDeployRole cannot be reused -- this is the
# equivalent, scoped to this one repo and its two stage environments.
#
# 2026-08-29: the trust boundary moved from deploy BRANCHES to deploy ENVIRONMENTS.
# `.github/workflows/deploy.yml` now runs every deploy against a GitHub Environment named
# for its stage (`staging` on a `main` push, `production` on a `v*` tag), so the OIDC
# token's `sub` claim is `repo:<org>/<repo>:environment:<stage>` rather than
# `...:ref:refs/heads/<branch>`. Pinning to the environment is strictly tighter: the
# `production` environment carries a required-reviewer gate, so the role cannot be assumed
# for a prod deploy without a human approving the run.

Parameters:
  # There is deliberately no GitHubOrg / GitHubRepo parameter. They existed to build the
  # `repository` and `repository_owner` conditions, which IAM cannot evaluate (see the trust
  # policy below) -- leaving them would be two knobs that look like they re-scope the role
  # and do nothing at all. The org and repo are inside every GitHubSub value instead, where
  # they are actually enforced.
  GitHubSub:
    Type: CommaDelimitedList
    Default: >-
      repo:JorenNagels/guestnote:environment:staging,repo:JorenNagels/guestnote:environment:production,repo:JorenNagels@37642555/guestnote@1336925415:environment:staging,repo:JorenNagels@37642555/guestnote@1336925415:environment:production
    Description: >-
      The exact `sub` claims allowed to assume the role -- one per (stage environment x
      subject form). `deploy.yml` sets `environment:` on every run, so the claim is
      `repo:<org>/<repo>:environment:<stage>`, never a branch or tag ref: a `main` push
      deploys `staging`, a `v*` tag deploys `production`, and neither ref appears here.
      IMPORTANT: repositories created after 2026-07-15 also present an IMMUTABLE subject of
      the shape `repo:<org>@<orgId>/<repo>@<repoId>:environment:<stage>` -- the classic form
      alone then silently fails to match and every deploy is "not authorized to perform
      sts:AssumeRoleWithWebIdentity". guestnote is one of those, so BOTH forms are in the
      default above (org 37642555, repo 1336925415, from
      `gh api /repos/JorenNagels/guestnote --jq '{org: .owner.id, repo: .id}'`). If those
      ids ever change, append -- never replace -- the new pair.
      TRAP, measured 2026-08-29: editing this Default does NOT update an existing stack.
      `aws cloudformation deploy` sends UsePreviousValue=true for any parameter absent from
      --parameter-overrides, so the stored value wins and the run reports "No changes to
      deploy" and exits 0. Always pass this parameter explicitly, and as JSON rather than
      shorthand -- the value is itself comma-separated, the shorthand parser splits on those
      commas, and that is how three of the four deployed entries acquired a trailing
      backslash. infra/README.md step 4 has the command and the read-back check.

  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      Set to false if token.actions.githubusercontent.com is already registered as an IAM
      OIDC provider in this account (only one per URL is allowed). A fresh member account has
      none, so the default creates it.

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # IAM validates GitHub's certificate against its own trusted-CA store now, so this
      # value is no longer load-bearing, but AWS::IAM::OIDCProvider still requires the
      # property. These are GitHub's published intermediate-cert thumbprints.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GuestnoteDeployRole
      # 2 h, not the 1 h default: a first-ever CloudFront distribution create runs 20-30 min
      # and `.github/workflows/deploy.yml` asks for `role-duration-seconds: 7200` to outlast
      # it. The two must agree or `AssumeRoleWithWebIdentity` rejects the request.
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # All exact matches. `StringEquals`, not `StringLike`: every value here is
              # literal, so a `*` accidentally hand-appended to GitHubSub (the note there
              # tells the operator to append immutable-form claims) is inert rather than a
              # wildcard.
              #
              # ## Two claims, and NOT `repository` / `repository_owner`
              #
              # This pinned those two as well until 2026-08-30, as belt-and-braces against a
              # botched `sub`. **It denied every deploy**, and silently: `sub`, `aud`,
              # `repository` and `repository_owner` in the real token were compared
              # byte-for-byte against this policy and all four matched, yet STS answered
              # "Not authorized to perform sts:AssumeRoleWithWebIdentity" for two hours. The
              # bisect (drop the pair, change nothing else) went green on the same `sub`.
              #
              # The reason: **IAM only populates a handful of OIDC claims as condition keys
              # -- `aud`, `sub`, and for this provider `job_workflow_ref`.** GitHub's custom
              # claims are in the JWT but are not condition keys, so `StringEquals` on one
              # compares against a key that does not exist, which is false, which denies.
              # IAM's own guardrail names the usable pair: a trust policy for this provider
              # that scopes neither `sub` nor `job_workflow_ref` is rejected outright at
              # write time ("must evaluate ... :sub or ... :job_workflow_ref which is not
              # scoped to all"). That error is how the pair was identified.
              #
              # Nothing is lost by dropping them. The immutable subject form carries the org
              # id and the repo id (`repo:JorenNagels@37642555/guestnote@1336925415:...`), so
              # a matching `sub` already proves which repository asked -- the belt-and-braces
              # was restating what `sub` says, and could not be evaluated anyway.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSub
      ManagedPolicyArns:
        # SST v3 / Pulumi provisions across many services (CloudFront, Lambda, S3, IAM
        # roles for the functions, Route 53, ACM, DynamoDB, SQS, EventBridge, CloudWatch,
        # the SST state bucket) and the exact action set shifts between SST releases.
        # AdministratorAccess is what the SST docs recommend for a self-hosted CI role, and
        # the real containment here is (a) this is a single-app member account and (b) the
        # trust policy above admits only two stage environments of one repo.
        #
        # The residual cost, stated plainly: any deploy run -- a `main` push (staging) or an
        # approved `v*` tag (production) -- has full admin on account 929219061071 via OIDC,
        # with no further scoping. The `production` environment's required reviewer is the
        # only thing between "can push a tag" and "prod admin". Tightening to a
        # least-privilege policy is a follow-up (infra/README.md "Deferred") once `sst
        # deploy` has run once and CloudTrail can report the action set it actually used.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"

Outputs:
  DeployRoleArn:
    Description: Put this account id into the AWS_ACCOUNT_ID GitHub Actions secret.
    Value: !GetAtt DeployRole.Arn
