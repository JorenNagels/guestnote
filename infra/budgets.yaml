AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  AWS Budgets alarms at 25 / 50 / 100 a month. research/06-hosting-costs.md section 7:
  "AWS Budgets alarms at EUR 25 / 50 / 100 on day one. Cheapest insurance in the stack."

# STATUS 2026-08-29: NOT applied. The `guestnote` account (929219061071) already carries
# three separate budgets -- `guestnote-monthly-cost-{25,50,100}usd`, each alerting at
# ACTUAL > 100% of its limit, subscriber njoren@gmail.com, the $25 one also FORECASTED --
# created outside this repo. This template is the IaC equivalent for a fresh account, or to
# adopt those three into one stack later. Applying it now just adds a duplicate.
#
# The account is billed in USD, and AWS Budgets rejects any other unit ("EUR is not in the
# supported unit set: [USD]"), so the research doc's "EUR 25/50/100" is really USD here.
#
# Applied by hand, once (on a clean account):
#
#   aws cloudformation deploy \
#     --template-file infra/budgets.yaml \
#     --stack-name guestnote-budgets \
#     --profile guestnote --region eu-central-1 \
#     --parameter-overrides NotifyEmail=you@example.com
#
# Budgets is a global (us-east-1-backed) service but the stack can live in any region.
# There is no confirmation-link step -- budget notifications are delivered to the address
# directly, unlike the SNS email subscription in mail-events.yaml.

Parameters:
  NotifyEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: must be an email address
    Description: Where the threshold alerts go.

  Currency:
    Type: String
    Default: USD
    AllowedValues: [USD]
    Description: >-
      AWS Budgets only accepts the account's billing currency, and this account is billed in
      USD -- any other value is a hard create failure ("EUR is not in the supported unit
      set: [USD]"), which is exactly how the EUR default here was caught on 2026-08-29.

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: guestnote-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 100
          Unit: !Ref Currency
      NotificationsWithSubscribers:
        # Three actual-spend thresholds plus one forecast, so a runaway is caught before
        # month end rather than after it.
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 25
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotifyEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotifyEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotifyEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotifyEmail
